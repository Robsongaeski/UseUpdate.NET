<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1137</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            font-family: "Times New Roman", Times, Georgia, serif;
            text-align: center;
            overflow: hidden;
        }
        .message-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            user-select: none;
        }
        .message {
            font-size: clamp(5.5rem, 27vw, 12rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -1px;
        }
        .footer {
            position: absolute;
            bottom: max(24px, env(safe-area-inset-bottom, 24px));
            left: 0;
            right: 0;
            text-align: center;
            padding: 0 16px;
            z-index: 10;
        }
        .footer a {
            color: rgba(255, 255, 255, 0.65);
            text-decoration: underline;
            text-underline-offset: 4px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.3px;
            transition: color 0.2s ease;
        }
        .footer a:hover,
        .footer a:active {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="message-container">
        <div class="message">
            Fuck<br>You.
        </div>
    </div>
    <div class="footer">
        <a href="https://www.useupdate.com.br/camiseta-qr-code-fy" target="_blank" rel="noopener noreferrer">
            peça a sua aqui
        </a>
    </div>
</body>
</html>
